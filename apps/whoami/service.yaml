# Namespace comes from kustomization.yaml. The selector must match the Deployment's
# immutable matchLabels exactly.
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/instance: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
