# Flux Kustomizations that reconcile the platform layer.
# platform-controllers installs operators (cert-manager, ESO, monitoring…);
# platform-configs applies the CRs that depend on them — and only after the
# controllers report Ready (dependsOn + wait). Both paths are empty until Phase 3.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-controllers
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  # Must be >= the longest HelmRelease timeout in this path (cert-manager: 10m), otherwise
  # this Kustomization reports Ready=False while the release underneath is still installing
  # happily. Phase 4's kube-prometheus-stack will need this headroom too.
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-controllers
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/configs
  prune: true
  wait: true
  # `wait: true` alone is NOT enough here. Flux's built-in health check (kstatus) only
  # understands generic signals (observedGeneration, Reconciling/Stalled conditions), so it
  # reports cert-manager's custom resources healthy the moment they exist — before the CA is
  # actually issued. These CEL expressions teach it to read the real Ready condition, so
  # `apps` cannot start until the CA chain genuinely works.
  healthCheckExprs:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      current: "status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')"
      failed: "status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')"
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: "status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')"
      failed: "status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')"
