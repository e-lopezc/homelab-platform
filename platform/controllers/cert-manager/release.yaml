# cert-manager, installed by Flux's helm-controller. Version pinned so a rebuild is
# reproducible; bumping it is a Git commit. crds.enabled installs cert-manager's CRDs,
# crds.keep leaves them in place on uninstall (avoids nuking Certificates).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.0"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true
