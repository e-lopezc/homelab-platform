# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, node-exporter and
# kube-state-metrics, and Grafana with the Prometheus and Alertmanager datasources wired in.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  # Must stay below platform-controllers' 15m timeout. The chart cold-pulls several images
  # (operator, prometheus, config-reloader, alertmanager, node-exporter, kube-state-metrics,
  # webhook cert job) — roughly twice cert-manager's four, hence more than its 10m.
  timeout: 12m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  # Helm installs CRDs from a chart's crds/ directory once and never upgrades them. A chart
  # bump would then run a newer operator against stale CRDs. CreateReplace makes Flux
  # update the CRDs on every install and upgrade.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    grafana:
      enabled: true

      # Admin credentials come from a Secret created out-of-band (kubectl create secret),
      # so no password lands in this public repo. External Secrets Operator takes over
      # this Secret in Phase 5. It must exist before this release is upgraded, or Grafana
      # cannot start and the whole kube-prometheus-stack upgrade fails and rolls back.
      admin:
        existingSecret: grafana-admin

      # Stateless by design: no PVC, no nodeSelector. Dashboards and datasources are
      # provisioned from labelled ConfigMaps by the sidecar, so they live in Git. A restart
      # loses only what was clicked into the UI (users, API tokens, edits). The sidecar already searches ALL namespaces
      # (chart default), so later Loki and OpenCost dashboards are picked up in place.

      # Same contract as whoami: the annotation has cert-manager issue grafana-tls from
      # the internal CA, and Traefik serves it.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: homelab-ca-issuer
        hosts:
          - grafana.homelab
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.homelab

      # Behind an ingress Grafana must know its public URL, or redirects and share
      # links point at the pod address.
      grafana.ini:
        server:
          root_url: https://grafana.homelab

      # Measured 2026-10-28: ~320Mi idle; a cluster dashboard plus Loki Explore pushed it
      # to the old 512Mi limit, where it thrashed for ~10 min and was OOMKilled. Request
      # covers the idle baseline; the limit leaves ~2x for interactive use. GOMEMLIMIT
      # makes the Go GC work harder near the limit instead of hitting the kernel OOM.
      # The limit also covers startup: the SQLite DB is an emptyDir, so every start re-runs
      # migrations and rebuilds the search index.
      # Pod total, sidecars included: 512Mi request / 1Gi limit.
      resources:
        requests:
          memory: 384Mi
        limits:
          memory: 768Mi
      env:
        GOMEMLIMIT: 650MiB

      # The chart's own sidecar ClusterRole grants cluster-wide read on Secrets. Bind to a
      # ConfigMap-only role instead (grafana-sidecar-clusterrole.yaml), and point both
      # sidecars at ConfigMaps only, or they keep listing Secrets and hit 403s.
      rbac:
        useExistingClusterRole: grafana-sidecar-configmaps
      sidecar:
        dashboards:
          resource: configmap
        datasources:
          resource: configmap
        # Applies to each sidecar container (dashboards and datasources), so it counts twice.
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi

    # k3s runs every control-plane component inside one process, and every metrics
    # endpoint on a node returns that process's whole registry. The kubelet endpoint on
    # the server already carries scheduler_, controller-manager and kubeproxy_ metrics
    # (agents carry kubeproxy_). The chart's dedicated jobs would target ports bound to
    # localhost and report TargetDown, and would only duplicate data if they worked. The
    # datastore is kine/SQLite (no --cluster-init), so there is no etcd to scrape.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    # Same cause, other direction: the server's kubelet endpoint and the apiserver endpoint
    # return the same ~35k series. Keep apiserver_/etcd_/kine_ on the apiserver job, whose
    # recording and SLO burn-rate rules expect job="apiserver", and drop them from kubelet.
    kubelet:
      serviceMonitor:
        # Helm replaces lists rather than merging them, so the chart's default rule
        # (first entry) must be restated or it is lost.
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver|etcd|kine)_.*

    alertmanager:
      alertmanagerSpec:
        # Receiver URLs (ntfy topic, healthchecks.io ping) live in a Secret created
        # out-of-band, never in Git. The operator mounts it at
        # /etc/alertmanager/secrets/alertmanager-receivers/<key>, and receivers read it via
        # url_file, so the rendered config only holds a path. It must exist before this
        # release is upgraded, or Alertmanager cannot start. External Secrets Operator takes
        # it over in Phase 5.
        secrets:
          - alertmanager-receivers

      # Only keys set here change; the chart's global, inhibit_rules and templates are kept.
      # Lists are replaced, not merged, so receivers must restate the chart's 'null'.
      # tplConfig is false, so {{ }} below reaches Alertmanager untouched by Helm.
      config:
        receivers:
          # Default sink: alerts that don't earn a phone notification stay in the UI.
          - name: "null"

          # Dead-man's switch. Watchdog always fires; healthchecks.io alarms when the pings
          # stop. healthchecks.io stores request bodies, so send the status only — the
          # default body carries externalURL/generatorURL (internal hostnames).
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-receivers/healthchecks-url
                send_resolved: false
                timeout: 10s
                payload:
                  status: "{{ .Status }}"

          # Phone notifications via ntfy.sh. ntfy.sh is a third party that sees plaintext, so
          # the payload replaces the default body: no instance, IPs, URLs or label sets leave
          # the cluster. ntfy fills title/message/priority from the X-* header templates.
          # Each rendered value is YAML-parsed by Alertmanager before JSON encoding, so a
          # summary containing ": " would turn into a map; reReplaceAll defuses that.
          # The two ntfy receivers differ only in priority. Duplicated on purpose: one receiver
          # templating priority from severity would fail silently if the template broke.
          - name: ntfy-default
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-receivers/ntfy-url
                send_resolved: true
                timeout: 10s
                http_config:
                  http_headers:
                    X-Template: { values: ["yes"] }
                    X-Title: { values: ["{{.title}}"] }
                    X-Message: { values: ["{{.message}}"] }
                    X-Priority: { values: ["{{.priority}}"] }
                payload:
                  title: "{{ .Status | toUpper }} · {{ .CommonLabels.alertname }}"
                  message: >-
                    {{ or .CommonLabels.severity "none" }} · {{ or .CommonLabels.namespace "cluster" }} ·
                    {{ reReplaceAll ": " " - " (or .CommonAnnotations.summary "no summary") }}
                  priority: "3"

          # Pages. Urgent while firing; the resolved message drops to default so the
          # all-clear doesn't buzz like the page did.
          - name: ntfy-high
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-receivers/ntfy-url
                send_resolved: true
                timeout: 10s
                http_config:
                  http_headers:
                    X-Template: { values: ["yes"] }
                    X-Title: { values: ["{{.title}}"] }
                    X-Message: { values: ["{{.message}}"] }
                    X-Priority: { values: ["{{.priority}}"] }
                payload:
                  title: "{{ .Status | toUpper }} · {{ .CommonLabels.alertname }}"
                  message: >-
                    {{ or .CommonLabels.severity "none" }} · {{ or .CommonLabels.namespace "cluster" }} ·
                    {{ reReplaceAll ": " " - " (or .CommonAnnotations.summary "no summary") }}
                  priority: '{{ if eq .Status "firing" }}5{{ else }}3{{ end }}'

        # Only routes is set: the chart's top-level route (receiver "null", group_by namespace,
        # 30s/5m/12h) is kept, so anything unmatched below stays in the UI. First match wins.
        # Paging is an explicit alertname allowlist, not severity: upstream "critical" covers
        # 32 rules written for production clusters. Adding a page = a PR that adds the name and
        # says why it is actionable. Regex matchers are fully anchored by Alertmanager.
        route:
          routes:
            # Heartbeat. Ticks every 1m, re-sends every 5m: healthchecks.io period 5m, grace 5m.
            - receiver: healthchecks
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 5m

            # Phone routes group by alertname too, so CommonLabels.alertname (the
            # notification title) is never empty when different alerts fire together.
            - receiver: ntfy-default
              matchers:
                - alertname =~ "AlloyNotShippingLogs|AlloyConfigReloadFailed"
              group_by: [alertname, namespace]

            # Pages: the cluster is broken, or alerting itself silently is.
            - receiver: ntfy-high
              matchers:
                - alertname =~ "KubeNodeNotReady|KubeletDown|KubeAPIDown|PrometheusBadConfig|PrometheusRuleFailures|AlertmanagerFailedReload"
              group_by: [alertname, namespace]

            # Disk, two tiers: critical (<10% free + full within 4h, or <3%) pages; warning
            # (<15% + full within 24h, or <5%) notifies, a day's lead time to act calmly.
            # The chart's inhibit rule mutes the warning once the critical fires.
            - receiver: ntfy-high
              matchers:
                - alertname =~ "NodeFilesystemAlmostOutOfSpace|NodeFilesystemSpaceFillingUp"
                - severity = "critical"
              group_by: [alertname, namespace]
            - receiver: ntfy-default
              matchers:
                - alertname =~ "NodeFilesystemAlmostOutOfSpace|NodeFilesystemSpaceFillingUp"
                - severity = "warning"
              group_by: [alertname, namespace]

    prometheus:
      prometheusSpec:
        # By default Prometheus only selects monitors and rules labelled with this Helm
        # release, so anything written outside the chart is silently ignored. Single-operator
        # cluster: every monitor in Git is intentional, so select them all.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # local-path + WaitForFirstConsumer pins the PV to whichever node the pod first
        # lands on, so choose that node deliberately (label applied by the k3s_node_labels
        # Ansible role). Loki pins to `logs` on agent-1, keeping the two stores apart.
        nodeSelector:
          homelab.local/observability: metrics
        # Whichever limit is hit first wins. local-path does not enforce the PVC size (the
        # volume is a directory on the node's root disk), so retentionSize is the real disk
        # cap. It counts blocks, WAL and head chunks.
        retention: 30d
        retentionSize: 12GiB
        # The request lets the scheduler see agent-2 as occupied, so unpinned pods land
        # elsewhere. k3s reserves no memory for the OS, so the limit protects the node:
        # a heavy query OOM-kills Prometheus, not the kubelet.
        resources:
          requests:
            memory: 1.5Gi
          limits:
            memory: 2.5Gi
        # local-path volumes cannot be expanded; this size is nominal but documents intent.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 15Gi
