# kube-prometheus-stack: Prometheus Operator, Prometheus, Alertmanager, node-exporter and
# kube-state-metrics, and Grafana with the Prometheus and Alertmanager datasources wired in.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  # Must stay below platform-controllers' 15m timeout. The chart cold-pulls several images
  # (operator, prometheus, config-reloader, alertmanager, node-exporter, kube-state-metrics,
  # webhook cert job) — roughly twice cert-manager's four, hence more than its 10m.
  timeout: 12m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.4.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  # Helm installs CRDs from a chart's crds/ directory once and never upgrades them. A chart
  # bump would then run a newer operator against stale CRDs. CreateReplace makes Flux
  # update the CRDs on every install and upgrade.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    grafana:
      enabled: true

      # Admin credentials come from a Secret created out-of-band (kubectl create secret),
      # so no password lands in this public repo. External Secrets Operator takes over
      # this Secret in Phase 5. It must exist before this release is upgraded, or Grafana
      # cannot start and the whole kube-prometheus-stack upgrade fails and rolls back.
      admin:
        existingSecret: grafana-admin

      # Stateless by design: no PVC, no nodeSelector. Dashboards and datasources are
      # provisioned from labelled ConfigMaps by the sidecar, so they live in Git. A restart
      # loses only what was clicked into the UI (users, API tokens, edits). The sidecar already searches ALL namespaces
      # (chart default), so later Loki and OpenCost dashboards are picked up in place.

      # Same contract as whoami: the annotation has cert-manager issue grafana-tls from
      # the internal CA, and Traefik serves it.
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: homelab-ca-issuer
        hosts:
          - grafana.homelab
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.homelab

      # Behind an ingress Grafana must know its public URL, or redirects and share
      # links point at the pod address.
      grafana.ini:
        server:
          root_url: https://grafana.homelab

      # Starting point, not measured. The limit has headroom because the SQLite DB is an
      # emptyDir: every start re-runs all migrations and rebuilds the search index, and an
      # OOM there fails the whole release. Revisit with Prometheus data after a week.
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 512Mi
      # The dashboard and datasource sidecars share this block.
      sidecar:
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 128Mi

    # k3s runs every control-plane component inside one process, and every metrics
    # endpoint on a node returns that process's whole registry. The kubelet endpoint on
    # the server already carries scheduler_, controller-manager and kubeproxy_ metrics
    # (agents carry kubeproxy_). The chart's dedicated jobs would target ports bound to
    # localhost and report TargetDown, and would only duplicate data if they worked. The
    # datastore is kine/SQLite (no --cluster-init), so there is no etcd to scrape.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false

    # Same cause, other direction: the server's kubelet endpoint and the apiserver endpoint
    # return the same ~35k series. Keep apiserver_/etcd_/kine_ on the apiserver job, whose
    # recording and SLO burn-rate rules expect job="apiserver", and drop them from kubelet.
    kubelet:
      serviceMonitor:
        # Helm replaces lists rather than merging them, so the chart's default rule
        # (first entry) must be restated or it is lost.
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver|etcd|kine)_.*

    prometheus:
      prometheusSpec:
        # By default Prometheus only selects monitors and rules labelled with this Helm
        # release, so anything written outside the chart is silently ignored. Single-operator
        # cluster: every monitor in Git is intentional, so select them all.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        # local-path + WaitForFirstConsumer pins the PV to whichever node the pod first
        # lands on, so choose that node deliberately (label applied by the k3s_node_labels
        # Ansible role). Loki pins to `logs` on agent-1, keeping the two stores apart.
        nodeSelector:
          homelab.local/observability: metrics
        # Whichever limit is hit first wins. local-path does not enforce the PVC size (the
        # volume is a directory on the node's root disk), so retentionSize is the real disk
        # cap. It counts blocks, WAL and head chunks.
        retention: 30d
        retentionSize: 12GiB
        # The request lets the scheduler see agent-2 as occupied, so unpinned pods land
        # elsewhere. k3s reserves no memory for the OS, so the limit protects the node:
        # a heavy query OOM-kills Prometheus, not the kubelet.
        resources:
          requests:
            memory: 1.5Gi
          limits:
            memory: 2.5Gi
        # local-path volumes cannot be expanded; this size is nominal but documents intent.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 15Gi
