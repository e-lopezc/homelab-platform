# Loki in single-binary mode: one pod, chunks and index on its own PVC, no object store.
# Shares the monitoring namespace (created by kube-prometheus-stack) with Grafana, its consumer.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart defaults to SimpleScalable (3x read/write/backend on S3). Filesystem storage
    # only supports one replica, and the chart refuses to render if any scalable target is
    # left above zero.
    deploymentMode: SingleBinary
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Pinned to the logs node (agent-1) so it never shares a node with Prometheus. Both hold
    # a local-path PV, and they do not fit together in one agent's 4.3Gi. The memory figures are
    # a first guess, sized like Prometheus was: agent-1 peaked at 0.98Gi used over 7d, which
    # leaves ~3.3Gi for Loki and Alloy. Re-check against the week-one working set.
    singleBinary:
      replicas: 1
      nodeSelector:
        homelab.local/observability: logs
      resources:
        requests:
          memory: 512Mi
        limits:
          memory: 1.5Gi
      persistence:
        # A label only: local-path does not enforce PVC size. retention_period is the real cap.
        size: 10Gi
        storageClass: local-path
        # Chart default is Delete for both. Keep the PV when the StatefulSet is scaled to zero
        # or deleted, so scale-to-zero stays a safe way to stop Loki without losing logs.
        whenScaled: Retain
        whenDeleted: Retain

    # Chart defaults sized for a multi-tenant cluster. The memcached chunks cache alone
    # requests 9830Mi, more than any node here has. At homelab ingest, Loki's own in-process
    # caches are enough.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    # nginx in front of Loki. Only useful for multi-tenant auth or the scalable read/write split.
    # Grafana and Alloy talk to the loki Service directly.
    gateway:
      enabled: false
    # The canary DaemonSet writes and queries synthetic logs on every node, and the helm test
    # depends on it. Loki's own metrics cover health.
    lokiCanary:
      enabled: false
    test:
      enabled: false
    # Alerting rules stay in Prometheus. Turning the rules sidecar off also empties the chart's
    # ClusterRole, which otherwise grants cluster-wide read on Secrets, the same problem we
    # fixed for Grafana's sidecar.
    sidecar:
      rules:
        enabled: false
    # Picked up by Prometheus because the kube-prometheus-stack selectors are open
    # (*SelectorNilUsesHelmValues: false). Gives ingest rate and disk use for sizing.
    monitoring:
      serviceMonitor:
        enabled: true

    loki:
      # Single tenant. With auth on, every client must send an X-Scope-OrgID header.
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # Fixed at first install. The from date must not be in the future, and changing an
      # existing period later makes stored chunks unreadable. Schema upgrades go in as a new entry.
      schemaConfig:
        configs:
          - from: "2026-10-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      # 7d retention, enforced by the compactor. Without retention_enabled, retention_period
      # is ignored and chunks are kept forever. Unlike Prometheus there is no size cap, so a
      # noisy pod can still fill agent-1's disk inside the 7d window. The node disk alert covers that.
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 168h
