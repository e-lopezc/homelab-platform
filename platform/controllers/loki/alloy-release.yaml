# Grafana Alloy as the log shipper for Loki: one pod per node, tailing that node's container
# logs from /var/log/pods. Lives with Loki because it has no other consumer.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: alloy
      version: "1.13.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # One instance per node, each reading only its own node's files. No nodeSelector or
    # tolerations: none of the nodes is tainted, and the server's logs (Grafana, Traefik,
    # cert-manager) are wanted too.
    controller:
      type: daemonset
      volumes:
        extra:
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          # Positions file, so a restarted or replaced pod resumes where it left off instead of
          # re-reading every log file on the node into Loki.
          - name: alloy-data
            hostPath:
              path: /var/lib/alloy/data
              type: DirectoryOrCreate

    # The PodLogs CRD is only for loki.source.podlogs. We tail files instead.
    crds:
      create: false

    # The chart's default rules grant cluster-wide read on Secrets, ConfigMaps, events and
    # every monitoring CRD, for components we don't run. discovery.kubernetes with role "pod"
    # only needs pods; each instance narrows to its own node with a spec.nodeName field
    # selector. Read on Nodes is not strictly needed, but chart 1.13.1 renders an invalid
    # ClusterRole when either list is empty, and node metadata is low-sensitivity.
    rbac:
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch"]
      clusterRules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]

    alloy:
      # Only /var/log/pods, where the kubelet keeps each container's stdout/stderr. The chart's
      # varlog switch would expose all of /var/log (auth.log, syslog, journal) to a root process.
      # k3s uses containerd, so the Docker mount stays off too.
      mounts:
        varlog: false
        dockercontainers: false
        extra:
          - name: varlogpods
            mountPath: /var/log/pods
            readOnly: true
          - name: alloy-data
            mountPath: /var/lib/alloy/data
      # Chart default is /tmp/alloy in the container's writable layer, lost on every restart.
      storagePath: /var/lib/alloy/data
      # Runs as root: the image sets no USER, and the pod log files are 0640 root-owned. Root
      # as owner needs no capabilities to read them, so everything else is locked down.
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      # Usage statistics sent to Grafana Labs.
      enableReporting: false
      # Soft limit under the 384Mi container limit, so the Go GC works harder before an OOMKill.
      extraEnv:
        - name: GOMEMLIMIT
          value: 300MiB
      # The pipeline: this node's pods -> 5 labels -> tail files -> parse CRI -> push to Loki.
      # Checked with `alloy validate` (v1.20.1); discovery and relabelling dry-run against the
      # cluster from a laptop.
      configMap:
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }

          // Pods on this node only. The chart sets HOSTNAME to spec.nodeName, so each instance of the
          // DaemonSet watches its own node's pods and never tails another node's files.
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          // Labels are Loki's index: every unique combination is a separate stream. Keep four
          // low-cardinality ones; app, version or request IDs stay in the log line and are searched there.
          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // The kubelet writes /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log. *.log skips
            // rotated .gz files.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$1/*.log"
            }
            // Pod discovery emits one target per container port. Dropping everything else collapses
            // them into one target per container, so no file is tailed twice.
            rule {
              action = "labelkeep"
              regex  = "namespace|pod|container|node|__path__"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          // Parses containerd's line format (timestamp, stream, flags, message). Keeps the original
          // timestamp, so lines re-read after a restart are exact duplicates that Loki drops. It also
          // adds a stream label (stdout/stderr), cheap at two values.
          loki.process "pod_logs" {
            stage.cri {}
            // loki.source.file adds the full file path as a label. It repeats pod and container and
            // starts a new stream on every container restart.
            stage.label_drop {
              values = ["filename"]
            }
            forward_to = [loki.write.loki.receiver]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki.monitoring:3100/loki/api/v1/push"
            }
          }
      # First guess for a 3-node homelab tailing a few dozen containers. agent-1 also carries
      # Loki (1.5Gi limit), with ~3.3Gi of headroom. Re-check against the week-one working set.
      # CPU request so Loki's bursts on agent-1 can't starve the shipper.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi

    # Sidecar that reloads Alloy when the ConfigMap changes. The chart sets a request but no limit.
    configReloader:
      resources:
        requests:
          memory: 50Mi
        limits:
          memory: 64Mi

    # Alloy's own metrics (lines read, push errors, dropped entries). Picked up through the
    # open kube-prometheus-stack selectors, like Loki's.
    serviceMonitor:
      enabled: true
